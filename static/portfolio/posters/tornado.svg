<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">IRR sensitivity tornado</title>
  <desc id="desc">Seven one-at-a-time sensitivities around a base IRR of 14.47 percent. Energy rate has the largest downside and upside range.</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <text x="176" y="30" font-size="22" font-weight="700" fill="#172033">IRR sensitivity tornado</text>
  <text x="164" y="92.53" text-anchor="end" font-size="16" fill="#273142">Heat Rate</text><rect x="557.03" y="65.54" width="37.91" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="65.54" width="36.66" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="151.10" text-anchor="end" font-size="16" fill="#273142">Construction Time</text><rect x="511.92" y="124.11" width="83.01" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="124.11" width="87.88" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="209.68" text-anchor="end" font-size="16" fill="#273142">Interest Rate</text><rect x="495.92" y="182.69" width="99.02" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="182.69" width="85.07" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="268.25" text-anchor="end" font-size="16" fill="#273142">Capacity Rate</text><rect x="402.62" y="241.26" width="192.32" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="241.26" width="166.42" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="326.82" text-anchor="end" font-size="16" fill="#273142">Waha Gas Price</text><rect x="384.73" y="299.83" width="210.20" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="299.83" width="178.02" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="385.39" text-anchor="end" font-size="16" fill="#273142">Total CAPEX</text><rect x="376.65" y="358.40" width="218.28" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="358.40" width="241.25" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="443.96" text-anchor="end" font-size="16" fill="#273142">Energy Rate</text><rect x="209.17" y="416.97" width="385.77" height="37.49" fill="#c0392b" rx="2"/><rect x="594.93" y="416.97" width="296.90" height="37.49" fill="#27ae60" rx="2"/>
  <line x1="594.93" x2="594.93" y1="50" y2="469" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="594.93" y="502" text-anchor="middle" font-size="17" fill="#111827">Base 14.47%</text>
  <rect x="715" y="18" width="14" height="14" fill="#c0392b"/><text x="736" y="31" font-size="15">Downside</text>
  <rect x="828" y="18" width="14" height="14" fill="#27ae60"/><text x="849" y="31" font-size="15">Upside</text>
</svg>