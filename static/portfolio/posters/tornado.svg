<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">IRR sensitivity tornado</title>
  <desc id="desc">Seven one-at-a-time sensitivities around a base IRR of 19.98 percent. Energy rate has the largest downside and upside range.</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <text x="176" y="30" font-size="22" font-weight="700" fill="#172033">IRR sensitivity tornado</text>
  <text x="164" y="92.53" text-anchor="end" font-size="16" fill="#273142">Inflation (CPI)</text><rect x="575.10" y="65.54" width="46.68" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="65.54" width="42.98" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="151.10" text-anchor="end" font-size="16" fill="#273142">Interest Rate</text><rect x="556.01" y="124.11" width="65.78" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="124.11" width="63.80" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="209.68" text-anchor="end" font-size="16" fill="#273142">Construction Time</text><rect x="529.57" y="182.69" width="92.21" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="182.69" width="49.83" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="268.25" text-anchor="end" font-size="16" fill="#273142">PPA Escalator</text><rect x="549.56" y="241.26" width="72.23" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="241.26" width="71.74" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="326.82" text-anchor="end" font-size="16" fill="#273142">Gas Escalator</text><rect x="520.84" y="299.83" width="100.95" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="299.83" width="98.28" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="385.39" text-anchor="end" font-size="16" fill="#273142">Total CAPEX</text><rect x="387.04" y="358.40" width="234.75" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="358.40" width="167.26" height="37.49" fill="#27ae60" rx="2"/><text x="164" y="443.96" text-anchor="end" font-size="16" fill="#273142">Waha Gas Price</text><rect x="223.55" y="416.97" width="398.23" height="37.49" fill="#c0392b" rx="2"/><rect x="621.79" y="416.97" width="255.66" height="37.49" fill="#27ae60" rx="2"/>
  <line x1="621.79" x2="621.79" y1="50" y2="469" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="621.79" y="502" text-anchor="middle" font-size="17" fill="#111827">Base 19.98%</text>
  <rect x="715" y="18" width="14" height="14" fill="#c0392b"/><text x="736" y="31" font-size="15">Downside</text>
  <rect x="828" y="18" width="14" height="14" fill="#27ae60"/><text x="849" y="31" font-size="15">Upside</text>
</svg>