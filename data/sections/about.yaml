# a summary about you
summary: |

  Hi, I am Fehmi! This site is my personal blog, where I will be logging my life and also demonstrating my professional work. The first page is my portfolio, where you can find my professional information. Posts is pretty much where I will be posting stuff.

  My doctoral research sits at the intersection of reservoir engineering, geomechanics, and scientific computing. At UT Austin, I work with [Dr. Mukul Sharma](https://sharma.pge.utexas.edu/members) and the [Center for Injection and Seismicity Research](https://cisr.beg.utexas.edu/#researchers) to study shallow wastewater injection in the Delaware Basin. I combine coupled numerical simulation, public subsurface data, and data-driven analysis to understand pressure propagation, fracture behavior, ground deformation, and the conditions that govern safe injection operations.

  I completed my Bachelor's degree in Petroleum and Natural Gas Engineering from [Middle East Technical University, Turkey](https://www.metu.edu.tr/en). During my Bachelor's degree, I have also worked under the supervision of [Dr. Fulya Gokalp Yavuz](https://stat.metu.edu.tr/en/fulya-gokalp-yavuz) in [Data Science Lab](https://dslab-stat.metu.edu.tr/the-team/#page-content) to enhance my statistical data analysis & data science knowledge. Following that, I pursued my Master's Degree at [UT Austin](https://www.utexas.edu/), working under the supervision of [Dr. Michael Pyrcz](https://michaelpyrcz.com/) and [Dr. John Foster](https://johnfoster.pge.utexas.edu/). During my Master's, I focused on resampling and tree-based ensemble methods for spatial/dependent data, gaining extensive skills in data analytics, machine learning, and geostatistics. I also learned practical skills like working in *NIX environments, shell scripting, and using tools like awk, vim, and git. I organized a hackathon, taught a *NIX-based lecture on High Performance Computing, and presented my work at the annual consortium meeting.


