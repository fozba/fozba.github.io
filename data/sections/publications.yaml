publications:
- title: Spatial bagging for predictive machine learning uncertainty quantification
  publishedIn:
    name: Computers & Geosciences, Volume 203, 105947
    date: September 2025
    url: https://doi.org/10.1016/j.cageo.2025.105947
  authors:
  - name: Fehmi Özbayrak
  - name: John T. Foster
    url: https://johnfoster.pge.utexas.edu/index.html
  - name: Michael J. Pyrcz
    url: https://www.pge.utexas.edu/faculty-and-staff/michael-pyrcz/
  paper:
    summary: Extends Spatial Bagging to predictive uncertainty quantification using effective-sample-size-adjusted resampling, then benchmarks accuracy and uncertainty behavior across synthetic datasets with varying noise and spatial correlation.
    url: https://doi.org/10.1016/j.cageo.2025.105947

- title: "Beyond random forest: how spatial bagging and spatial random forest dominate for subsurface applications?"
  publishedIn:
    name: Computational Geosciences, Volume 29, Article 52
    date: 2025
    url: https://doi.org/10.1007/s10596-025-10388-0
  authors:
  - name: Ahmed Merzoug
  - name: Fehmi Özbayrak
  - name: John T. Foster
    url: https://johnfoster.pge.utexas.edu/index.html
  - name: Michael J. Pyrcz
    url: https://www.pge.utexas.edu/faculty-and-staff/michael-pyrcz/
  paper:
    summary: Evaluates spatially aware bagging and random-forest variants for subsurface prediction, extending the Spatial Bagging framework to multivariate spatial workflows.
    url: https://doi.org/10.1007/s10596-025-10388-0

- title: Spatial bagging to integrate spatial correlation into ensemble machine learning
  publishedIn:
    name: Computers & Geosciences, Volume 186, 105558
    date: April 2024
    url: https://doi.org/10.1016/j.cageo.2024.105558
  authors:
  - name: Fehmi Özbayrak
  - name: John T. Foster
    url: https://johnfoster.pge.utexas.edu/index.html
  - name: Michael J. Pyrcz
    url: https://www.pge.utexas.edu/faculty-and-staff/michael-pyrcz/
  paper:
    summary: Introduces Spatial Bagging, which combines spatial bootstrap resampling with effective sample size to account for spatial dependence in ensemble machine learning and reduce overfitting relative to standard bagging.
    url: https://doi.org/10.1016/j.cageo.2024.105558
