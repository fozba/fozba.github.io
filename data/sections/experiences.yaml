experiences:
- company:
    name: UT Austin / Center for Integrated Seismicity Research
    url: "https://cisr.beg.utexas.edu/"
    location: Austin, Texas
  positions:
  - designation: Graduate Research Assistant
    start: Summer 2024
    responsibilities:
    - Build and calibrate coupled reservoir-geomechanics models using well logs and injection and pressure histories to investigate fracture containment, pressure transmission, and induced-seismicity risk in the Delaware Basin.
    - Design sensitivity studies that separate stress, operating, pressure, and leakoff controls while communicating calibration non-uniqueness and model limitations.
    - Develop auditable scientific workflows for geological poromechanics, including verified MOOSE/PorousFlow case generation and serial/MPI execution.

- company:
    name: Fervo Energy
    url: "https://fervoenergy.com/"
    location: Houston, Texas
    logo: /images/experiences/fervo_logo.png
  positions:
  - designation: Reservoir Engineering Intern
    start: May 2025
    end: Aug 2025
    responsibilities:
    - Architected and implemented a modular Python platform for geothermal development planning, connecting configurable well schedules and surface-facility allocation to daily power forecasts, costs, and contract economics.
    - Integrated a machine-learning proxy for production-temperature evolution to accelerate repeated schedule evaluation.
    - Formulated doublet drilling start times as Pyomo optimization variables, maximizing project revenue subject to power-delivery constraints.
    - Built interactive Plotly and Dash tools for constructing, running, and reviewing development scenarios.

- company:
    name: DiReCT Consortium, The University of Texas at Austin
    location: Austin, Texas
  positions:
  - designation: Graduate Research Assistant
    start: 2022
    end: 2024
    responsibilities:
    - Developed Spatial Bagging, an ensemble-learning method that uses geostatistical effective sample size to represent spatial dependence in bootstrap sampling.
    - Led the software, experiments, and first-author writing for two peer-reviewed papers on spatial prediction and uncertainty quantification.
    - Contributed as second author to a later Spatial Random Forest extension.

