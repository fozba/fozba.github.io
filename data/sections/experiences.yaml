- company:
    name: Fervo Energy
    url: "https://fervoenergy.com/"
    location: Houston, Texas
    logo: /images/experiences/fervo_logo.png
    # darkLogo: /images/experiences/company-dark.png #(optional), Can optionally show a different logo for dark theme
  positions:
  - designation: Reservoir Engineering Intern
    start: May 2025
    end: Aug 2025
    responsibilities:
      - Architected and developed a modular Python platform for the rapid techno-economic forecasting of geothermal assets, integrating machine learning proxy models with a sophisticated physics engine.
      - Engineered a robust, end-to-end machine learning workflow, including data pipeline development, physics-informed feature engineering, and the training and validation of proxy models to predict long-term reservoir performance.
      - Integrated a Bayesian Optimization engine to automate the search for revenue-maximizing drilling schedules, leveraging the speed of the ML proxy models to turn the platform into a prescriptive strategic tool.
      - Developed an interactive web-based GUI, enabling engineers and analysts to intuitively build, run, and visualize complex, multi-facility and multi-contract development scenarios.
      - Established a professional software foundation with comprehensive documentation, a fully reproducible environment, and a documented API to ensure the platform's long-term maintainability and extensibility.
